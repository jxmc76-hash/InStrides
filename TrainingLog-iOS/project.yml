name: TrainingLog
options:
  bundleIdPrefix: com.traininglog
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  TrainingLog:
    type: application
    platform: iOS
    sources:
      - path: TrainingLog
    settings:
      base:
        INFOPLIST_FILE: TrainingLog/Info.plist
        CODE_SIGN_ENTITLEMENTS: TrainingLog/TrainingLog.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.johnmccarthy.traininglog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
